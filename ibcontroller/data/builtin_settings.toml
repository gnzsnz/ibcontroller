# Built-in declarative settings -- always loaded (settings.load_builtin_settings_file),
# always applied (control_loop._apply_declarative_settings), regardless of whether
# Config.settings_file is set. Each entry below only actually fires when its own
# value_from_config resolves to something other than None (settings.py's own
# _resolve_value/skip-on-None rule) -- so this file is a safe no-op on any install
# that hasn't set the matching Config field.
#
# Overriding a built-in entry: if a future TWS/Gateway release moves a control (a
# different tree_path/label, say), add an entry to your own ibkr_settings.toml with
# the SAME value_from_config as the built-in you're replacing -- settings.py's merge
# rule matches on that field and uses your entry instead of this one, rather than
# applying both. See ibkr_settings.toml.example for a worked override example.
#
# See that same file for the entry-field reference (tree_path/action/label/
# label_ref/value/value_from_config/field_index) -- not repeated here.

# auto_logoff_time is applied BEFORE auto_restart_time -- both write the same
# Lock and Exit radio-button pair, so if a deployment sets both fields, the
# last one applied wins the shared radio group. Keeping auto_logoff_time
# first here makes auto_restart_time win when both are set, matching IBC's
# own stated precedence ("if values are supplied for both, only the
# auto-restart time is set"). Do not reorder these two entries.
[[settings]]
tree_path = "Lock and Exit"
action = "auto_logoff_time"
value_from_config = "auto_logoff_time"

[[settings]]
tree_path = "Lock and Exit"
action = "auto_restart_time"
value_from_config = "auto_restart_time"

[[settings]]
tree_path = "API/Settings"
action = "toggle"
label_ref = "read_only_api"
value_from_config = "read_only_api"
