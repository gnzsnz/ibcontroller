name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore environment
        run: uv sync --all-groups

      - name: Pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Build Java agent jar
        run: make build

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Verify jar is packaged in wheel
        run: python -m zipfile -l dist/*.whl | grep -q ibcontroller-agent.jar
