name: Publish

on:
  push:
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: zulu

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the package version from git tags
          # (pyproject.toml: dynamic = ["version"]); a shallow clone
          # would silently produce a fallback/dev version.
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore environment
        run: uv sync --all-groups

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build jar and Python distribution
        run: make dist

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing to PyPI -- no API token in secrets
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Sign distributions with Sigstore, upload to GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mandatory for making GitHub Releases
      id-token: write  # mandatory for sigstore
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          # git-cliff needs the full commit/tag log to build the changelog
          fetch-depth: 0

      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz ./dist/*.whl

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          # no cliff.toml -- git-cliff's built-in default config already
          # groups Conventional Commits (feat/fix/docs/...) correctly
          args: --latest --tag ${{ github.ref_name }} --strip header
          output: CHANGELOG_release.md

      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            cat CHANGELOG_release.md
            echo
            echo "## Installation"
            echo
            echo "    pip install py-ib-controller==${TAG#v}"
            echo
            echo "## Verifying release artifacts"
            echo
            echo "Assets are signed with [Sigstore](https://www.sigstore.dev/). To verify:"
            echo
            echo "    pip install sigstore"
            echo "    sigstore verify identity dist/*.whl dist/*.tar.gz \\"
            echo "      --cert-identity https://github.com/$REPO/.github/workflows/publish.yml@refs/tags/$TAG \\"
            echo "      --cert-oidc-issuer https://token.actions.githubusercontent.com"
            echo
            echo "\`SHA256SUMS\` is attached for checksum verification."
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$REPO/compare/$PREV_TAG...$TAG"
            fi
          } > notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ github.ref_name }}'
          --repo '${{ github.repository }}' --notes-file notes.md

      - name: Upload artifacts and signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # dist/ contains the built packages, SHA256SUMS, plus the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
