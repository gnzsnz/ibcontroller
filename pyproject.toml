[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ibcontroller"]

[tool.setuptools.package-data]
ibcontroller = ["data/*.json", "data/*.toml", "data/*.example", "*.jar"]

[project]
name = "ibcontroller"
dynamic = ["version"]
description = "Login/launch controller for TWS and IBKR Gateway, via an in-process Java agent"
readme = "README.md"
authors = [
    { name = "gnzsnz", email = "8376642+gnzsnz@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
]

dependencies = [
    "aeventkit",
    "attrs",
    "cattrs",
    "python-dotenv>=1.2.3",
    "platformdirs>=4.11.7",
    "typer>=0.15.1",
    "typed-settings",
    "anyio>=4.15.1",
]

[project.scripts]
ibcontroller = "ibcontroller.cli:app"

[dependency-groups]
dev = [
    "ruff",
    "pyrefly",
    "pre-commit>=3.7.1",
    "bandit[toml]>=1.7.8",
    "pytest>=9.1.1",
    "pytest-env>=1.1.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio",
    "pytest-sugar",
    "tox>=4.0.0",
    "aresponses",
    "pytest-timeout",
    "pytest-aiohttp",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "NPY2", "RUF"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["B"]

[tool.ruff.lint.pylint]
# 2026-09-06: several actions.py/settings.py write ops legitimately grew a 6th
# parameter (an optional `window_id` for scoping a lookup to one specific
# window -- see EventBridge.java's own docstring for why) -- not a smell to
# refactor around, the default of 5 was just tuned before this project needed it.
max-args = 6

[tool.ruff.lint.per-file-ignores]
# Expected values in assertions are the point of a test, not a magic number to name.
"tests/*" = ["PLR2004"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[tool.bandit]
#exclude_dirs = ["tests"]
# B404/B603: launching TWS/Gateway itself is this project's job (L1) -- subprocess use
# is inherent, not incidental, and args come from local LaunchConfig, never a shell.
skips = ["B101", "B405", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
log_cli = true
#log_cli_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
minversion = "6.0"
filterwarnings = "ignore"


[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
